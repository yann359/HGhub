[package]
name = "hghub-hpp"
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
rquickjs = { version = "0.12.2", features = ["loader", "array-buffer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy", "gzip", "brotli", "json", "charset", "stream"] }
url = "2"
base64 = "0.22"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
aes-gcm = "0.10"
rand = "0.8"
dom_query = "0.28"
cookie = "0.18"
futures-util = "0.3"
axum = "0.7"
regex = "1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# rquickjs ships neither Android nor iOS bindings; generate them against the target SDK.
rquickjs = { version = "0.12.2", features = ["bindgen"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
rquickjs-sys = { path = "../../vendor/rquickjs-sys" }

