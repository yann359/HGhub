name: Plugin player checks
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  plugins:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/crates/hpp -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/crates/hpp/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: pnpm test:plugins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-player-checks
          path: test-results/plugins/
          retention-days: 7
