name: HGhub iOS Full
on:
  workflow_dispatch:
  push:
    branches: [codex/ios-liquid-glass-plugin]
    paths-ignore: ['**.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 3
      IPHONEOS_DEPLOYMENT_TARGET: '16.4'
      HGHUB_IOS_IPA_NAME: HGhub_iOS_Full.ipa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/crates/hpp -> target
          key: ios-liquidglass
          cache-on-failure: true
      - name: Record build environment
        run: |
          mkdir -p artifacts/logs
          { xcodebuild -version; xcodebuild -showsdks; rustc -Vv; node --version; pnpm --version; git rev-parse HEAD; } | tee artifacts/logs/environment.txt
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend type check and production build
        run: set -o pipefail; pnpm build 2>&1 | tee artifacts/logs/frontend.log
      - name: Rust plugin runtime tests
        run: set -o pipefail; cargo test --manifest-path src-tauri/crates/hpp/Cargo.toml --locked 2>&1 | tee artifacts/logs/rust-tests.log
      - name: Initialize iOS project
        run: set -o pipefail; pnpm tauri ios init --ci 2>&1 | tee artifacts/logs/ios-init.log
      - name: Build ARM64 Release and validate unsigned IPA
        run: bash scripts/build-ios-unsigned.sh 1.1.0
      - name: Upload verified installation package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-Full
          path: |
            artifacts/*.ipa
            artifacts/*manifest.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-build-logs
          path: |
            artifacts/logs/
            build_output/*.xcresult
            src-tauri/gen/apple/project.yml
          if-no-files-found: warn
          retention-days: 30

  simulator:
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 3
      HGHUB_IOS_SIMULATOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-27-simulator
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Initialize iOS project
        run: pnpm tauri ios init --ci
      - name: Build and launch in iOS Simulator
        run: bash scripts/build-ios-unsigned.sh 1.1.0
      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-simulator
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 30
