<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>HGhub · 插件视频播放器</title>
    <script>
      try {
        const mode = JSON.parse(localStorage.getItem("hpp.theme") || '"system"');
        if (mode === "light" || (mode !== "dark" && matchMedia("(prefers-color-scheme: light)").matches)) document.documentElement.classList.add("theme-light");
      } catch (e) {}
    </script>
    <style>html,body{background:#1a1a1a}html.theme-light,html.theme-light body{background:#f3f3f3}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
